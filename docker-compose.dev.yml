# Local development stack: backend API, React frontend, Ollama.
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DFAT_ENV: development
      DFAT_LLM_API_URL: http://ollama:11434/api/generate
      DFAT_DATABASE__URL: sqlite+aiosqlite:///./data/dfat.db
      DFAT_API__CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command:
      [
        "uvicorn",
        "dfat.app:create_app",
        "--factory",
        "--reload",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: /api/v1
      NODE_OPTIONS: --openssl-legacy-provider
      CHOKIDAR_USEPOLLING: "true"
      DFAT_BACKEND_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
