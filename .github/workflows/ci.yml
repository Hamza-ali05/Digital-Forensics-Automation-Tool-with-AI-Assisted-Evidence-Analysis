name: DFAT CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,forensic]" --break-system-packages

      - name: Run linting
        run: make lint

      - name: Run type checking
        run: make type-check

      - name: Run backend unit tests
        run: make test-unit

      - name: Run backend integration tests
        run: make test-integration-full

      - name: Run API contract tests
        run: make test-contract

      - name: Run security tests
        run: make test-security

      - name: Run coverage check
        run: make test-coverage-check

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            htmlcov/
            coverage.json

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npx eslint src/ --ext .js,.jsx

      - name: Run tests
        run: npm test -- --watchAll=false --coverage

      - name: Run build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t dfat-backend .

      - name: Build frontend Docker image
        run: docker build -t dfat-frontend frontend/

      - name: Verify images built successfully
        run: |
          docker image inspect dfat-backend > /dev/null 2>&1
          docker image inspect dfat-frontend > /dev/null 2>&1
          echo "Both Docker images built successfully"
