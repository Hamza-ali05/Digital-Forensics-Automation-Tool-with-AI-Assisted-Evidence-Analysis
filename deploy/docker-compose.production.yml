version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env.production.local
    volumes:
      - evidence_data:/var/lib/dfat/evidence
      - report_data:/var/lib/dfat/reports
      - audit_logs:/var/log/dfat
      - db_data:/var/lib/dfat
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - dfat_internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dfat_internal

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - dfat_internal

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - dfat_internal
    deploy:
      resources:
        limits:
          memory: 8G

volumes:
  evidence_data:
  report_data:
  audit_logs:
  db_data:
  ollama_models:

networks:
  dfat_internal:
    driver: bridge
