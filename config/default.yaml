# DFAT default configuration.
# Precedence: default.yaml → {environment}.yaml → .env → environment variables.

env: development

# Evidence input locations and accepted forensic formats.
evidence:
  evidence_dir: ./data/evidence
  max_evidence_size_gb: 100.0
  supported_disk_formats:
    - ".dd"
    - ".raw"
    - ".e01"
    - ".img"
    - ".001"
  supported_memory_formats:
    - ".raw"
    - ".vmem"
    - ".dmp"
    - ".mem"

# Stage 1–2 forensic acquisition and parsing defaults.
forensic_engine:
  volatility_symbols_path: null
  max_artefacts_per_category: 10000
  parse_timeout_seconds: 300

# Stage 3 local LLaMA-3 triage settings (host-local API only).
ai_engine:
  llm_api_url: http://localhost:11434/api/generate
  llm_model: llama3
  temperature: 0.1
  max_tokens: 4096
  request_timeout_seconds: 120
  enable_fallback: true
  context_window: 8192
  max_retries: 3
  retry_delay_seconds: 2.0
  cache_responses: true
  cache_ttl_seconds: 3600
  max_input_artefacts: 500
  use_rag: true

# Stage 4 dual-output reporting settings.
reporting:
  output_dir: ./data/outputs
  json_schema_version: "1.0.0"
  template_dir: src/dfat/reporting/templates

# Stage 5 benchmark evaluation settings.
evaluation:
  ground_truth_dir: ./data/ground_truth
  dfrws_dataset_path: null
  cfreds_dataset_path: null
  metrics_thresholds:
    precision_min: 0.0
    recall_min: 0.0
    f1_min: 0.0

# Application structured logging and forensic audit trail.
logging:
  log_level: INFO
  audit_log_path: ./data/outputs/audit.log
  log_format: json

# Integrity hashing settings.
security:
  hash_algorithms:
    - sha256
    - md5
  primary_hash: sha256

# Async SQLAlchemy persistence (metadata/audit/users only — no evidence blobs).
database:
  url: "sqlite+aiosqlite:///./data/dfat.db"
  echo: false
  pool_size: 5
  max_overflow: 10
  create_tables_on_startup: true
  slow_query_threshold_ms: 100
  enable_query_monitoring: true

# Local JWT authentication settings.
auth:
  secret_key: "CHANGE-ME-IN-PRODUCTION-USE-SECRETS"
  algorithm: "HS256"
  access_token_expire_minutes: 60
  refresh_token_expire_days: 7
  password_min_length: 12
  max_login_attempts: 5
  lockout_duration_minutes: 30

# HTTP API settings.
api:
  cors_allow_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

# Five-stage forensic pipeline orchestration.
pipeline:
  max_concurrent_jobs: 1
  stage_timeout_seconds: 600
  parser_timeout_seconds: 300
  max_artefacts_per_category: 10000
  enable_artefact_correlation: true
  enable_timeline_generation: true
  enable_ioc_detection: true
  volatility_plugins_timeout: 300
  enable_memory_registry: true

# Dataset intelligence extension package (Prompt 11 additive subsystem).
dataset_intelligence:
  datasets_dir: data/datasets
  scan_on_startup: true
  watch_for_changes: true
  watch_interval_seconds: 60
  max_dataset_size_gb: 100
  auto_index: true
  auto_preprocess: true
  supported_extensions:
    - ".dd"
    - ".raw"
    - ".e01"
    - ".vmem"
    - ".pcap"
    - ".evtx"
    - ".csv"
    - ".json"
    - ".xml"
    - ".yar"
    - ".yml"
    - ".stix"
    - ".txt"
    - ".zip"
    - ".gz"
  vector_store_path: data/knowledge/vector_store
  knowledge_graph_path: data/knowledge/graph
  ioc_database_path: data/knowledge/ioc_db
  ml_models_path: data/ml/models
  experiments_path: data/ml/experiments

# Local ML lifecycle (Prompt 11 Group D).
ml:
  models_dir: data/ml/models
  experiments_dir: data/ml/experiments
  auto_retrain: true
  retrain_threshold: 0.1
  test_split: 0.2
  validation_split: 0.1
  random_seed: 42
  max_training_time_seconds: 300
  cross_validation_folds: 5
