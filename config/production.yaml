database:
  url: "${DFAT_DATABASE_URL}"
  echo: false
  pool_size: 10
  max_overflow: 20
  create_tables_on_startup: false

auth:
  secret_key: "${DFAT_JWT_SECRET}"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7
  max_login_attempts: 3
  lockout_duration_minutes: 60

ai_engine:
  llm_api_url: "http://ollama:11434"
  temperature: 0.1
  cache_responses: true
  cache_ttl_seconds: 7200

logging:
  log_level: "WARNING"
  audit_log_path: "/var/log/dfat/audit.log"
  log_format: "json"

pipeline:
  max_concurrent_jobs: 2
  stage_timeout_seconds: 900

reporting:
  output_dir: "/var/lib/dfat/reports"

evidence:
  evidence_dir: "/var/lib/dfat/evidence"
