[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfat"
version = "0.1.0"
description = "Digital Forensics Automation Tool with AI-Assisted Evidence Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DFAT Contributors" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "dependency-injector>=4.41",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=23.0",
    "cryptography>=41.0",
    "aiofiles>=23.0",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
forensic = [
    "pytsk3>=20230125",
    "python-registry>=1.3",
    "volatility3>=2.4",
    "python-evtx>=0.7",
]
# ai optional group reserved for future use.
# LLaMA-3 integration via local HTTP API — no Python package dependency
ai = []
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.11",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1",
    "mypy>=1.5",
    "types-PyYAML>=6.0",
    "pre-commit>=3.4",
]

[project.scripts]
dfat = "dfat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pytsk3",
    "Registry",
    "Registry.*",
    "Evtx",
    "Evtx.*",
    "volatility3",
    "volatility3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
