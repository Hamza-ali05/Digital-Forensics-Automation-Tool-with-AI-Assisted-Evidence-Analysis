[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfat"
version = "0.1.0"
description = "Digital Forensics Automation Tool with AI-Assisted Evidence Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DFAT Contributors" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]",
    "dependency-injector>=4.41",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=23.0",
    "cryptography>=41.0",
    "aiofiles>=23.0",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    "jsonschema>=4.20",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "alembic>=1.12",
]

[project.optional-dependencies]
forensic = [
    "pytsk3>=20230125",
    "python-registry>=1.3",
    "volatility3>=2.4",
    "python-evtx>=0.7",
    "python-magic>=0.4",
]
# ai optional group reserved for future use.
# LLaMA-3 integration via local HTTP API — no Python package dependency
ai = []
production = [
    "asyncpg>=0.28",
]
auth = [
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "argon2-cffi>=23.1",
    "email-validator>=2.0",
]
reporting = [
    "reportlab>=4.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.11",
    "black>=23.0",
    "isort>=5.12",
    "ruff>=0.1",
    "mypy>=1.5",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.20",
    "pre-commit>=3.4",
    "bandit>=1.7",
]

[project.scripts]
dfat = "dfat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pytsk3",
    "Registry",
    "Registry.*",
    "Evtx.*",
    "volatility3",
    "volatility3.*",
    "reportlab",
    "reportlab.*",
    "weasyprint",
    "weasyprint.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers -m 'not performance'"
markers = [
    "performance: query, API, and AI latency tests (run via make test-performance)",
    "requires_ollama: tests that need a running local Ollama instance",
    "quality: AI parsing, scoring, and hallucination tests (no LLM required)",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]
